<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>محمد السبعان للمحاماة</title>
<meta name="description" content="مكتب محمد السبعان للمحاماة والاستشارات القانونية في المملكة العربية السعودية. خدمات قانونية للشركات والأفراد.">

<link rel="icon" href="assets/logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap">

<style>
/* Layout concept: a dark espresso ledger — full-bleed film and photography bands
   separated by sharp-cornered cream insets; hairline brass rules do all the dividing.
   Single committed theme (the firm's brand board), zero border-radius, RTL-first. */
:root{
  --ink:#183756;            /* espresso ground */
  --ink-raise:#214665;      /* raised panel */
  --ink-deep:#10263d;       /* footer / wells */
  --rust:#b68c66;           /* brand terracotta */
  --rust-lift:#c69e79;
  --brass:#b68c66;          /* hairlines, active states, numerals */
  --bone:#f7f8fa;           /* paper inset */
  --bone-dim:#dce4eb;
  --on-ink:#f7f8fa;
  --on-ink-soft:#bfccd8;
  --on-bone:#214665;
  --on-bone-soft:#526577;
  --line:rgba(182,140,102,.26);
  --line-bone:rgba(24,55,86,.16);

  --d-ar:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --d-en:"Fraunces",Georgia,"Times New Roman",serif;
  --b-ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --b-en:"IBM Plex Sans",system-ui,-apple-system,sans-serif;

  --display:var(--d-ar);
  --body:var(--b-ar);
  --lh:1.95;
  --wrap:1180px;
  color-scheme:dark;
}
:root[lang="en"]{ --display:var(--d-en); --body:var(--b-en); --lh:1.65 }

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--on-ink);
  font-family:var(--body);font-size:17px;line-height:var(--lh);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(16,38,61,.96)}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
::selection{background:var(--rust);color:#fff}

.wrap{
  max-width:var(--wrap);margin-inline:auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
}
.band{padding-block:clamp(64px,9vw,120px)}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---- type ---- */
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
:root[lang="en"] h1,:root[lang="en"] h2,:root[lang="en"] h3{font-weight:400;letter-spacing:-.015em}
.eyebrow{
  font-family:var(--b-ar);font-size:12px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0 0 18px;
  display:flex;align-items:center;gap:12px;
}
:root[lang="en"] .eyebrow{font-family:var(--b-en)}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line);max-width:90px}
.h-sec{font-size:clamp(26px,3.6vw,44px);line-height:1.3}
:root[lang="en"] .h-sec{line-height:1.12}
.lede{color:var(--on-ink-soft);max-width:62ch;margin:18px 0 0;font-size:17px}
.num{font-family:var(--d-en);font-variant-numeric:tabular-nums;color:var(--brass)}

/* ---- mark ---- */
.mark{display:block}
.mark svg{display:block;overflow:visible}

/* ---- header ---- */
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:rgba(16,38,61,0);backdrop-filter:blur(0px);
  transition:background .4s ease,backdrop-filter .4s ease,border-color .4s ease;
  border-bottom:1px solid transparent;
}
.hdr.solid{background:rgba(16,38,61,.9);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.hdr-in{display:flex;align-items:center;gap:22px;height:74px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand .mark svg{width:26px;height:auto}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;gap:26px;margin-inline-start:auto;align-items:center}
.nav a{font-size:14px;color:var(--on-ink-soft);transition:color .25s;position:relative;padding-block:6px}
.nav a::after{content:"";position:absolute;inset-inline-start:0;bottom:0;height:1px;width:0;background:var(--brass);transition:width .3s}
.nav a:hover{color:var(--on-ink)}.nav a:hover::after{width:100%}
.hdr-act{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang{
  font-family:var(--b-en);font-size:12px;letter-spacing:.1em;border:1px solid var(--line);
  padding:9px 13px;color:var(--on-ink-soft);transition:.25s;
}
.lang:hover{border-color:var(--brass);color:var(--brass)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;font-size:14px;font-weight:500;letter-spacing:.02em;
  border:1px solid var(--rust);background:var(--rust);color:#fff;transition:.28s;white-space:nowrap;
}
.btn:hover{background:var(--rust-lift);border-color:var(--rust-lift)}
.btn.sm{padding:11px 20px;font-size:13px}
.btn.ghost{background:none;border-color:var(--line);color:var(--on-ink)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass);background:rgba(182,140,102,.06)}
.btn.dark{border-color:var(--on-bone);background:var(--on-bone);color:var(--bone)}
.btn.dark:hover{background:var(--rust);border-color:var(--rust);color:#fff}
.burger{display:none;width:40px;height:40px;align-items:center;justify-content:center}
.burger span{display:block;width:20px;height:1px;background:var(--on-ink);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:1px;background:var(--on-ink);transition:.3s}
.burger span::before{top:-6px}.burger span::after{top:6px}

/* ---- hero ---- */
.hero{position:relative;min-height:min(92svh,860px);display:flex;align-items:flex-end;overflow:hidden}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(16,38,61,.97) 2%,rgba(16,38,61,.82) 26%,rgba(16,38,61,.28) 58%,rgba(16,38,61,.55) 100%);
}
.hero-in{position:relative;z-index:2;width:100%;padding-block:clamp(48px,8vw,96px) clamp(44px,6vw,72px)}
.hero .eyebrow{color:var(--bone-dim);margin-bottom:22px}
.hero h1{font-size:clamp(30px,5.4vw,66px);line-height:1.28;max-width:17ch}
:root[lang="en"] .hero h1{line-height:1.04;max-width:15ch}
.hero .lede{color:var(--bone-dim);font-size:clamp(16px,1.5vw,19px);max-width:50ch;margin-top:24px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
.scroll-cue{
  display:flex;align-items:center;gap:10px;margin-top:46px;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--on-ink-soft);
}
.scroll-cue i{display:block;width:34px;height:1px;background:var(--brass);transform-origin:var(--cue-origin,left);animation:cue 2.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleX(.3);opacity:.5}50%{transform:scaleX(1);opacity:1}}

/* ---- about ---- */
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,76px);align-items:center}
.fig{position:relative}
.fig img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.92)}
.fig::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}
.about p{color:var(--on-ink-soft);margin:22px 0 0;max-width:56ch}
.about p:first-of-type{color:var(--on-ink)}
.about .h-sec{margin-top:4px}

/* ---- services ---- */
.svc-head{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px}
.chip{
  padding:10px 20px;font-size:13px;border:1px solid var(--line);color:var(--on-ink-soft);
  transition:.25s;letter-spacing:.02em;
}
.chip:hover{color:var(--on-ink);border-color:var(--on-ink-soft)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:34px;border:1px solid var(--line)}
.card{
  background:var(--ink);padding:30px 28px 26px;text-align:start;
  display:flex;flex-direction:column;gap:14px;min-width:0;
  transition:background .3s;position:relative;
}
.card:hover{background:var(--ink-raise)}
.card::before{
  content:"";position:absolute;inset-block-start:0;inset-inline-start:0;height:2px;width:0;
  background:var(--rust);transition:width .35s ease;
}
.card:hover::before{width:100%}
.card .ico{width:30px;height:30px;color:var(--brass);flex-shrink:0}
.card .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:18px;line-height:1.5;font-weight:600}
:root[lang="en"] .card h3{font-size:20px;font-weight:500}
.card p{margin:0;font-size:14.5px;color:var(--on-ink-soft);line-height:1.8}
.card .more{
  margin-top:auto;padding-top:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brass);display:flex;align-items:center;gap:8px;opacity:.75;transition:opacity .25s;
}
.card:hover .more{opacity:1}
.card[hidden]{display:none}

/* ---- split blocks ---- */
.split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
.split .pane{padding:clamp(40px,6vw,84px) clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center}
.split .pic{position:relative;min-height:380px;background:var(--ink-deep)}
.split .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split.paper{background:var(--bone);color:var(--on-bone)}
.split.paper .eyebrow{color:var(--rust)}
.split.paper .lede{color:var(--on-bone-soft)}
.split.paper .ul li{border-color:var(--line-bone)}
.split.paper .ul li::before{background:var(--rust)}
.split.rusty{background:var(--rust)}
.split.rusty .eyebrow{color:rgba(255,255,255,.72)}
.split.rusty .eyebrow::after{background:rgba(255,255,255,.28)}
.split.rusty .lede{color:rgba(255,255,255,.84)}
.split.rusty .ul li{border-color:rgba(255,255,255,.2)}
.split.rusty .ul li::before{background:#fff}
.ul{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:0}
.ul li{
  padding-block:14px;border-top:1px solid var(--line);font-size:15px;
  display:flex;align-items:center;gap:12px;
}
.ul li:last-child{border-bottom:1px solid var(--line)}
.ul li::before{content:"";width:5px;height:5px;background:var(--brass);flex-shrink:0}
.split .btn{align-self:flex-start;margin-top:34px}

/* ---- values ---- */
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-bone);border:1px solid var(--line-bone);margin-top:40px}
.val{background:var(--bone);padding:38px 32px 42px;display:flex;flex-direction:column;gap:16px;min-width:0}
.val .n{font-size:13px;letter-spacing:.2em;color:var(--rust);font-family:var(--d-en);font-variant-numeric:tabular-nums}
.val h3{font-size:21px;color:var(--on-bone)}
.val p{margin:0;color:var(--on-bone-soft);font-size:15px}
.paper-band{background:var(--bone);color:var(--on-bone)}
.paper-band .eyebrow{color:var(--rust)}
.paper-band .lede{color:var(--on-bone-soft)}

/* ---- vision ---- */
.vision{position:relative;min-height:min(72svh,620px);display:flex;align-items:center;overflow:hidden}
.vision img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vision::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(16,38,61,.92),rgba(16,38,61,.55))}
:root[lang="en"] .vision::after{background:linear-gradient(to left,rgba(16,38,61,.92),rgba(16,38,61,.55))}
.vision .wrap{position:relative;z-index:2}
.vision p{
  font-family:var(--display);font-size:clamp(24px,3.8vw,46px);line-height:1.5;
  max-width:19ch;margin:20px 0 0;font-weight:500;
}
:root[lang="en"] .vision p{line-height:1.16;max-width:17ch;font-weight:300}

/* ---- credentials ---- */
.creds{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:38px}
.cred{background:var(--ink-raise);padding:30px 26px;display:flex;flex-direction:column;gap:12px}
.cred .ico{width:26px;height:26px;color:var(--on-ink-soft);opacity:.75}
.cred .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.1}
.cred span{font-size:15px;color:var(--on-ink)}
.cred em{font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-ink-soft);opacity:.6}

/* ---- form ---- */
.form-band{background:var(--ink-raise)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:38px}
.field{display:flex;flex-direction:column;gap:9px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;letter-spacing:.04em;color:var(--on-ink-soft)}
.field label .req{color:var(--rust)}
.field input,.field select,.field textarea{
  font:inherit;font-size:15.5px;background:var(--ink);color:var(--on-ink);
  border:1px solid var(--line);padding:15px 16px;transition:border-color .25s,background .25s;
  width:100%;min-width:0;border-radius:0;
}
.field textarea{resize:vertical;min-height:130px;line-height:1.7}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 48%,var(--brass) 50%),linear-gradient(-45deg,transparent 48%,var(--brass) 50%);background-size:6px 6px;background-repeat:no-repeat;background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%}
:root[dir="rtl"] .field select{background-position:20px 55%,15px 55%;background-image:linear-gradient(-45deg,transparent 48%,var(--brass) 50%),linear-gradient(45deg,transparent 48%,var(--brass) 50%)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);outline:none;background:rgba(182,140,102,.04)}
.field .err{font-size:12.5px;color:var(--rust-lift);min-height:0}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--rust-lift)}
.consent{display:flex;gap:13px;align-items:flex-start;font-size:14px;color:var(--on-ink-soft);line-height:1.7}
.consent input{width:18px;height:18px;flex-shrink:0;margin:3px 0 0;accent-color:var(--rust)}
.form-foot{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:30px}
.form-note{font-size:13.5px;color:var(--on-ink-soft);max-width:40ch}
.form-msg{margin-top:22px;padding:18px 20px;border:1px solid var(--line);font-size:15px;background:var(--ink)}
.form-msg.ok{border-color:var(--brass);color:var(--brass)}
.form-msg.no{border-color:var(--rust-lift);color:var(--rust-lift)}

/* ---- contact ---- */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(34px,5vw,72px);align-items:start}
.crow{display:flex;gap:16px;padding-block:20px;border-top:1px solid var(--line);align-items:flex-start}
.crow:last-child{border-bottom:1px solid var(--line)}
.crow .ico{width:20px;height:20px;color:var(--brass);flex-shrink:0;margin-top:3px}
.crow .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round}
.crow .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-ink-soft);display:block;margin-bottom:4px}
.crow .v{font-size:16px;color:var(--on-ink);word-break:break-word}
.crow .v[dir="ltr"]{display:inline-block;font-variant-numeric:tabular-nums}
.copy{margin-inline-start:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-ink-soft);border:1px solid var(--line);padding:6px 11px;transition:.25s;flex-shrink:0}
.copy:hover{color:var(--brass);border-color:var(--brass)}

/* ---- footer ---- */
.ftr{background:var(--ink-deep);padding-block:clamp(50px,6vw,78px) 0}
.ftr-top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:38px}
.ftr .brand .mark svg{width:34px}
.ftr-tag{color:var(--on-ink-soft);font-size:14.5px;max-width:34ch;margin:20px 0 0}
.ftr h4{font-family:var(--body);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--brass);margin:0 0 18px;font-weight:500}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.ftr ul a{font-size:14.5px;color:var(--on-ink-soft);transition:color .25s}
.ftr ul a:hover{color:var(--on-ink)}
.ftr-btm{
  margin-top:50px;padding-block:24px 30px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px 30px;justify-content:space-between;
  font-size:12.5px;color:var(--on-ink-soft);
}
.ftr-btm p{margin:0;max-width:60ch}

/* ---- modal ---- */
.ovl{
  position:fixed;inset:0;z-index:80;background:rgba(10,25,40,.82);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.ovl[hidden]{display:none!important}
.sheet{
  background:var(--ink-raise);border:1px solid var(--line);max-width:520px;width:100%;
  padding:clamp(28px,4vw,44px);position:relative;max-height:88svh;overflow-y:auto;
}
.sheet .ico{width:34px;height:34px;color:var(--brass);margin-bottom:20px}
.sheet .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.sheet h3{font-size:clamp(22px,3vw,30px);line-height:1.4}
.sheet p{color:var(--on-ink-soft);margin:16px 0 0}
.sheet .tag{display:inline-block;margin-top:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);border:1px solid var(--line);padding:6px 12px}
.sheet .btn{margin-top:30px;width:100%}
.x{position:absolute;inset-block-start:16px;inset-inline-end:16px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--on-ink-soft);transition:color .25s}
.x:hover{color:var(--on-ink)}

/* ---- mobile sticky ---- */
.mbar{
  display:none;position:fixed;inset-inline:0;bottom:0;z-index:55;
  background:rgba(16,38,61,.97);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px));
}
.mbar-in{display:grid;grid-template-columns:1fr 1fr}
.mbar a{display:flex;align-items:center;justify-content:center;gap:9px;padding:17px 10px;font-size:14px;font-weight:500}
.mbar a:first-child{background:var(--rust);color:#fff}
.mbar a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---- reveal ---- */
.rv.arm{opacity:0;transform:translateY(22px);transition:opacity .85s cubic-bezier(.22,.8,.3,1),transform .85s cubic-bezier(.22,.8,.3,1)}
.rv.arm.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1!important;transform:none!important;transition:none}
  .scroll-cue i{animation:none}
  *{scroll-behavior:auto!important}
}

/* ---- responsive ---- */
@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .ftr-top{grid-template-columns:1fr 1fr;gap:34px}
  .nav{display:none}
  .burger{display:flex}
  .nav.open{
    display:flex;flex-direction:column;gap:0;position:absolute;inset-inline:0;top:100%;

var L='ar', t=T.ar, filter='all';
try{if(localStorage.getItem('alsabaan-language')==='en')L='en'}catch(e){}
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function buildServices(){
  var g=$('#grid');
  g.innerHTML = SVC.map(function(s,i){
    var c = L==='ar'?s.ar:s.en;
    return '<button class="card" type="button" data-i-idx="'+i+'" data-t="'+s.t+'">'+
      '<span class="ico">'+svgIco(s.k)+'</span>'+
      '<h3>'+c[0]+'</h3><p>'+c[1]+'</p>'+
      '<span class="more">'+t.cardMore+' <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" style="transform:scaleX('+(L==='ar'?-1:1)+')"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></span>'+
      '</button>';
  }).join('');
  applyFilter();
  var sel=$('#f-service');
  sel.innerHTML='<option value="">'+t.fPick+'</option>'+SVC.map(function(s){
    var n=L==='ar'?s.ar[0]:s.en[0];return '<option value="'+n+'">'+n+'</option>';
  }).join('');
  syncServicePicker();
}
function buildChips(){
  var defs=[['all',t.chipAll],['corp',t.chipCorp],['ind',t.chipInd]];
  $('#chips').innerHTML=defs.map(function(d){
    return '<button class="chip" type="button" data-fl="'+d[0]+'" aria-pressed="'+(filter===d[0])+'">'+d[1]+'</button>';
  }).join('');
}
function applyFilter(){
  $$('#grid .card').forEach(function(c){
    var tt=c.dataset.t;
    c.hidden = !(filter==='all' || tt===filter || tt==='both');
  });
}
function buildLists(){
  $('#corpList').innerHTML=t.corpList.map(function(x){return '<li>'+x+'</li>'}).join('');
  $('#indList').innerHTML=t.indList.map(function(x){return '<li>'+x+'</li>'}).join('');
  $('#vals').innerHTML=t.vals.map(function(v){
    return '<div class="val"><span class="n">'+v[0]+'</span><h3>'+v[1]+'</h3><p>'+v[2]+'</p></div>';
  }).join('');
  $('#creds').innerHTML=t.creds.map(function(c){
    return '<div class="cred"><span class="ico">'+svgIco(c[0])+'</span><span>'+c[1]+'</span><em>'+c[2]+'</em></div>';
  }).join('');
}
function escapeText(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function buildContact(){
  var pending=L==='ar'?'تُضاف بيانات التواصل الرسمية قريبًا':'Official contact details will be added soon';
  var rows=[['mail',t.rowEmail,CONTACT.email||(L==='ar'?'يُضاف قريبًا':'Coming soon'),CONTACT.email?'mailto:'+CONTACT.email:'',CONTACT.email?1:0],['pin',t.rowLocation,L==='ar'?CONTACT.addrAr:CONTACT.addrEn,CONTACT.mapsUrl,0],['clock',t.rowHours,t.hours,'',0]];
  if(CONTACT.whatsRaw)rows.unshift(['phone',t.rowPhone,CONTACT.phoneIntl,'tel:+'+CONTACT.whatsRaw,1],['whats',t.rowWhats,CONTACT.whatsIntl,waLink(),1]);
  $('#contactRows').innerHTML=rows.map(function(r){
    r[2]=escapeText(r[2]);
    var val = r[4] ? '<a class="v" dir="ltr" href="'+r[3]+'"'+(r[0]==='whats'?' target="_blank" rel="noopener"':'')+'>'+r[2]+'</a>'
                   : (r[3]? '<a class="v" href="'+r[3]+'" target="_blank" rel="noopener">'+r[2]+'</a>' : '<span class="v">'+r[2]+'</span>');
    return '<div class="crow"><span class="ico">'+svgIco(r[0])+'</span><span style="min-width:0"><span class="k">'+r[1]+'</span>'+val+'</span>'+
      (r[4]?'<button class="copy" type="button" data-copy="'+r[2]+'">'+t.copy+'</button>':'')+'</div>';
  }).join('');
}
function waLink(service,details){
  if(!CONTACT.whatsRaw)return '#contact';
  var text=t.waText;
  if(service)text+='\n\n'+t.fService+': '+service;
  if(details)text+='\n\n'+details;
  return 'https://wa.me/'+CONTACT.whatsRaw+'?text='+encodeURIComponent(text);
}
function refreshWhatsAppLinks(){
  $$('a[data-i="ctaPrimary"],#waBtn').forEach(function(a){a.href=waLink();a.target='_blank';a.rel='noopener noreferrer'});
  var call=$('.mbar-in a:last-child');call.href=CONTACT.whatsRaw?'tel:+'+CONTACT.whatsRaw:'#contact';
}
function applyContactConfig(config){
  if(!config||!/^\d{8,15}$/.test(config.whatsapp||''))return;
  CONTACT.whatsRaw=config.whatsapp;CONTACT.phoneIntl='+'+config.whatsapp;CONTACT.whatsIntl=CONTACT.phoneIntl;
  CONTACT.addrAr=config.address_ar||CONTACT.addrAr;CONTACT.addrEn=config.address_en||CONTACT.addrEn;
  if(config.maps_url)CONTACT.mapsUrl=config.maps_url;
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(config.email||''))CONTACT.email=config.email;
  if(config.hours_ar)T.ar.hours=config.hours_ar;if(config.hours_en)T.en.hours=config.hours_en;
  if(Number.isFinite(config.latitude)&&Number.isFinite(config.longitude)){
    var mapSrc='https://maps.google.com/maps?q='+config.latitude+','+config.longitude+'&z=16&output=embed';
    var map=$('.map-panel iframe');if(map.getAttribute('src')!==mapSrc)map.src=mapSrc;
  }
  $('.map-link').href=CONTACT.mapsUrl;
  $$('[data-i="hours"]').forEach(function(el){el.textContent=t.hours});
  refreshWhatsAppLinks();buildContact();
}
window.addEventListener('message',function(event){
  if(event.source!==window.parent||!event.data||event.data.type!=='streamlit:render')return;
  var args=event.data.args||{};applyContactConfig(args.contact);receiveHost(args);
});


function render(){
  t=T[L];
  var r=document.documentElement;
  r.lang=L; r.dir=t.dir;
  r.style.setProperty('--cue-origin', t.dir==='rtl'?'right':'left');
  $$('[data-i]').forEach(function(el){ var v=t[el.dataset.i]; if(typeof v==='string') el.textContent=v; });
  $('[data-i="heroH"]').innerHTML=L==='ar'?'حين تتعقّد المسائل،<br>يبدأ <span class="hero-accent">الوضوح.</span>':'When matters get complex,<br><span class="hero-accent">clarity begins.</span>';
  $('#lang').textContent=t.langBtn;
  $('.menu-language').textContent=t.langBtn;
  $('.menu-label').textContent=L==='ar'?'القائمة':'Menu';
  $('.close-label').textContent=L==='ar'?'إغلاق':'Close';
  $('#burger').setAttribute('aria-label',L==='ar'?'فتح القائمة':'Open menu');
  $('#nav').setAttribute('aria-label',L==='ar'?'القائمة الرئيسية':'Main menu');
  $('.menu-links').setAttribute('aria-label',L==='ar'?'القائمة الرئيسية':'Main menu');
  $('#lang').setAttribute('aria-label', L==='ar'?'Switch to English':'التبديل إلى العربية');
  $('#aboutImg').alt=t.aboutAlt;
  $('#visionImg').alt=t.visionAlt;
  $('#corpImg').alt=t.corpAlt;
  $('#indImg').alt=t.indAlt;
  refreshWhatsAppLinks(); updateVideoControl();
  document.title = L==='ar' ? 'محمد السبعان للمحاماة' : 'Mohammed Al-Sabaan Law Firm';
  buildChips(); buildServices(); buildLists(); buildContact();
  clearErrors();
}

$('#lang').addEventListener('click',function(){ L = L==='ar'?'en':'ar'; try{localStorage.setItem('alsabaan-language',L)}catch(e){} render(); });

$('#chips').addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.fl;
  $$('#chips .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.fl===filter))});
  applyFilter();
});

var ovl=$('#ovl'), lastFocus=null;
$('#grid').addEventListener('click',function(e){
  var c=e.target.closest('.card'); if(!c) return;
  var s=SVC[+c.dataset.iIdx], cp = L==='ar'?s.ar:s.en;
  lastFocus=c;
  $('#f-service').value=cp[0];syncServicePicker();
  $('#sheetIco').innerHTML=svgIco(s.k);
  $('#sheetH').textContent=cp[0];
  $('#sheetP').textContent=cp[1];
  $('#sheetTag').textContent = s.t==='corp'?t.chipCorp : s.t==='ind'?t.chipInd : t.chipAll;
  $('#sheetCta').textContent=t.ctaPrimary;
  $('#sheetCta').href=waLink(cp[0]);$('#sheetCta').target='_blank';$('#sheetCta').rel='noopener noreferrer';
  ovl.hidden=false; document.body.style.overflow='hidden';
  $('#sheetX').focus();
});
function closeSheet(){ ovl.hidden=true; document.body.style.overflow=''; if(lastFocus) lastFocus.focus(); }
$('#sheetX').addEventListener('click',closeSheet);
$('#sheetCta').addEventListener('click',function(){ /* closed after the request is saved */ });
ovl.addEventListener('click',function(e){ if(e.target===ovl) closeSheet(); });
document.addEventListener('keydown',function(e){
  if(ovl.hidden)return;
  if(e.key==='Escape')closeSheet();
  if(e.key==='Tab'){
    var first=$('#sheetX'),last=$('#sheetCta');
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

document.addEventListener('click',function(e){
  var b=e.target.closest('.copy'); if(!b) return;
  var txt=b.dataset.copy, done=function(){ b.textContent=t.copied; setTimeout(function(){b.textContent=t.copy},1800) };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(select) } else select();
  function select(){
    var r=document.createRange(); r.selectNodeContents(b.closest('.crow').querySelector('.v'));
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done();
  }
});

var burger=$('#burger'), nav=$('#nav');
function setMenu(open,restoreFocus){
  nav.hidden=!open;
  burger.setAttribute('aria-expanded',String(open));
  document.documentElement.classList.toggle('menu-is-open',open);
  $$('main,footer,.mbar').forEach(function(el){el.inert=open});
  if(open){$('.menu-close').focus()}else if(restoreFocus){burger.focus()}
}
burger.addEventListener('click',function(){setMenu(nav.hidden,true)});
$('.menu-close').addEventListener('click',function(){setMenu(false,true)});
$('.menu-language').addEventListener('click',function(){$('#lang').click()});
nav.addEventListener('click',function(e){if(e.target.closest('a'))setMenu(false,false)});
document.addEventListener('keydown',function(e){
  if(nav.hidden)return;
  if(e.key==='Escape'){e.preventDefault();setMenu(false,true)}
  if(e.key==='Tab'){
    var focusables=Array.from(nav.querySelectorAll('a[href],button:not([disabled])'));
    var first=focusables[0],last=focusables[focusables.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

var hdr=$('#hdr');
function onScroll(){ hdr.classList.toggle('solid', window.scrollY>40) }
window.addEventListener('scroll',onScroll,{passive:true}); onScroll();

$$('a[href^="#"]').forEach(function(a){
  a.addEventListener('click',function(e){
    var id=a.getAttribute('href'); if(!id||!id.startsWith('#')||id==='#'||id.length<2) return;
    var el=document.querySelector(id); if(!el) return;
    e.preventDefault();
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var y=el.getBoundingClientRect().top+window.scrollY-$('#hdr').getBoundingClientRect().height-18;
    var destination=el.querySelector('h2')||el;
    destination.setAttribute('tabindex','-1');destination.focus({preventScroll:true});
    window.scrollTo({top:y,behavior:reduce?'auto':'smooth'});
    if(a.dataset.track){ filter=a.dataset.track==='corporate'?'corp':'all';
      $$('#chips .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.fl===filter))}); applyFilter(); }
  });
});

function closeServicePicker(returnFocus){
  $('#service-options').hidden=true;
  $('#service-trigger').setAttribute('aria-expanded','false');
  if(returnFocus) $('#service-trigger').focus();
}
function syncServicePicker(){
  var sel=$('#f-service');
  $('#service-value').textContent=sel.value || t.fPick;
  $('#service-options').innerHTML=Array.from(sel.options).slice(1).map(function(o,i){
    return '<button type="button" role="option" class="service-option" data-option="'+(i+1)+'" aria-selected="'+(o.selected?'true':'false')+'">'+o.textContent+'</button>';
  }).join('');
  closeServicePicker(false);
}
function openServicePicker(last){
  $('#service-options').hidden=false;
  $('#service-trigger').setAttribute('aria-expanded','true');
  var options=$$('.service-option');
  var selected=$('.service-option[aria-selected="true"]');
  (selected || options[last?options.length-1:0]).focus();
}
$('#service-trigger').addEventListener('click',function(){
  if($('#service-options').hidden) openServicePicker(false); else closeServicePicker(false);
});
$('#service-trigger').addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openServicePicker(e.key==='ArrowUp')}
});
$('#service-options').addEventListener('click',function(e){
  var option=e.target.closest('[data-option]'); if(!option)return;
  $('#f-service').selectedIndex=Number(option.dataset.option);
  syncServicePicker();
  $('#f-service').dispatchEvent(new Event('change',{bubbles:true}));
  closeServicePicker(true);
});
$('#service-options').addEventListener('keydown',function(e){
  var options=$$('.service-option'),i=options.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();closeServicePicker(true)}
  else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    e.preventDefault();
    var next=e.key==='Home'?0:e.key==='End'?options.length-1:(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;
    options[next].focus();
  }
});
document.addEventListener('click',function(e){if(!e.target.closest('.service-picker'))closeServicePicker(false)});
document.addEventListener('focusin',function(e){if(!e.target.closest('.service-picker'))closeServicePicker(false)});
$('#form').addEventListener('reset',function(){setTimeout(syncServicePicker,0)});

/* ===== form ===== */
function clearErrors(){ $$('#form .field').forEach(function(f){ f.classList.remove('bad'); f.querySelectorAll('input,textarea,button').forEach(function(el){el.removeAttribute('aria-invalid')}); var e=$('[data-err]',f); if(e) e.textContent='' }) }
function setErr(name,msg){
  var f=$('#form .field[data-f="'+name+'"]'); if(!f) return;
  f.classList.add('bad');f.querySelectorAll('input,textarea,button').forEach(function(el){el.setAttribute('aria-invalid','true')}); $('[data-err]',f).textContent=msg;
}
$('#form').addEventListener('submit',function(e){
  e.preventDefault();
  clearErrors();
  var msgEl=$('#formMsg'); msgEl.hidden=true; msgEl.className='form-msg';
  var name=$('#f-name').value.trim(), mob=$('#f-mobile').value.replace(/[\s-]/g,''),
      mail=$('#f-email').value.trim(), svc=$('#f-service').value, ok=true, first=null;

  if(name.length<2){ setErr('name',t.eName); ok=false; first=first||'#f-name' }
  if(!/^(?:0?5\d{8}|(?:\+?966)5\d{8})$/.test(mob)){ setErr('mobile',t.eMobile); ok=false; first=first||'#f-mobile' }
  if(mail && !/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(mail)){ setErr('email',t.eEmail); ok=false; first=first||'#f-email' }
  if(!svc){ setErr('service',t.eService); ok=false; first=first||'#service-trigger' }
  if(!$('#f-consent').checked){ setErr('consent',t.eConsent); ok=false; first=first||'#f-consent' }

  if(!ok){ if(first) $(first).focus(); return }

  if(!CONTACT.whatsRaw){msgEl.hidden=false;msgEl.textContent=L==='ar'?'التواصل غير متاح مؤقتًا.':'Contact is temporarily unavailable.';return}
  var details=[t.fName+': '+name,t.fMobile+': '+mob,mail?t.fEmail+': '+mail:'',$('#f-details').value.trim()].filter(Boolean).join('\n');
  var url=waLink(svc,details);
  submitEnquiry({source:'form',service:svc,name:name,mobile:mob,email:mail,details:$('#f-details').value.trim(),consent:true},url);

});

/* ===== reveal ===== */
if('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target) } });
  },{rootMargin:'0px 0px -8% 0px',threshold:.06});
  $$('.rv').forEach(function(el){
    if(el.getBoundingClientRect().top < window.innerHeight*1.05) return;
    el.classList.add('arm'); io.observe(el);
  });
}

/* reduced motion: poster only */
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  var v=$('#heroVid'); if(v){ v.pause(); v.removeAttribute('autoplay') }
}


/* Bidirectional Streamlit events: one acknowledged event at a time. */
var hostNonce=null,eventQueue=[],inflight=null,visitQueued=false,enquiryBusy=false;
function browserId(storage,key){
  try{var value=storage.getItem(key);if(value)return value;value=crypto.randomUUID();storage.setItem(key,value);return value}catch(e){return crypto.randomUUID()}
}
function sendNext(){
  if(!hostNonce||inflight||!eventQueue.length)return;
  inflight=eventQueue.shift();
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{...inflight.event,nonce:hostNonce},dataType:'json'},'*');
}
function receiveHost(args){
  hostNonce=args.nonce||hostNonce;
  if(inflight&&args.receipt&&args.receipt.id===inflight.event.id){
    var finished=inflight;inflight=null;if(finished.done)finished.done(args.receipt);
  }
  if(hostNonce&&!visitQueued){
    visitQueued=true;
    eventQueue.push({event:{kind:'visit',id:browserId(sessionStorage,'alsabaan-visit'),visitor:browserId(localStorage,'alsabaan-visitor')}});
  }
  sendNext();
}
function statusMessage(message,url){
  var el=$('#requestStatus');el.hidden=false;el.textContent=message;
  var dismiss=document.createElement('button');dismiss.type='button';dismiss.className='status-dismiss';dismiss.textContent='×';
  dismiss.setAttribute('aria-label',L==='ar'?'إغلاق الرسالة':'Dismiss message');
  dismiss.onclick=function(){el.hidden=true};el.appendChild(dismiss);
  if(url){var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=L==='ar'?'افتح واتساب':'Open WhatsApp';el.appendChild(a)}
}
function submitEnquiry(fields,url){
  if(enquiryBusy)return;
  if(!hostNonce){statusMessage(L==='ar'?'يرجى الانتظار حتى اكتمال الاتصال ثم إعادة المحاولة.':'Please wait for the connection and try again.');return}
  enquiryBusy=true;
  var popup=window.open('about:blank','_blank');if(popup)popup.opener=null;
  statusMessage(L==='ar'?'جارٍ حفظ طلبك…':'Saving your request…');
  eventQueue.push({event:{kind:'request',id:crypto.randomUUID(),language:L,...fields},done:function(receipt){
    enquiryBusy=false;
    if(!receipt.ok){if(popup)popup.close();statusMessage(L==='ar'?'تعذر حفظ الطلب. راجع التفاصيل وأعد المحاولة.':'Unable to save the request. Check your details and try again.');return}
    if(!ovl.hidden)closeSheet();
    statusMessage(L==='ar'?'تم حفظ الطلب. تابع المحادثة في واتساب.':'Request saved. Continue the conversation in WhatsApp.',url);
    if(popup&&!popup.closed)popup.location.href=url;
  }});
  sendNext();
}
document.addEventListener('click',function(e){
  var a=e.target.closest('a');if(!a||!a.href.startsWith('https://wa.me/'))return;
  if(a.closest('#requestStatus'))return;
  e.preventDefault();
  submitEnquiry({source:'whatsapp',service:a.id==='sheetCta'?$('#sheetH').textContent:''},a.href);
});

function updateVideoControl(){
  var v=$('#heroVid'),b=$('#videoToggle');if(!v||!b)return;
  b.textContent=v.paused?'▷':'Ⅱ';b.setAttribute('aria-label',v.paused?t.videoPlay:t.videoPause);
}
$('#videoToggle').addEventListener('click',function(){var v=$('#heroVid');if(v.paused)v.play().catch(function(){});else v.pause()});
$('#heroVid').addEventListener('play',updateVideoControl);$('#heroVid').addEventListener('pause',updateVideoControl);
render();
applyContactConfig(window.LAW_OFFICE_CONFIG);
if(window.parent!==window){
  // Streamlit creates component frames with scrolling disabled. Explicitly enable
  // native iframe scrolling; viewport-height framing keeps sticky UI in view.
  try{
    var hostFrame=window.frameElement;
    if(hostFrame){
      function enableFrameScroll(){if(hostFrame.getAttribute('scrolling')!=='yes')hostFrame.setAttribute('scrolling','yes');hostFrame.style.overflowY='auto'}
      enableFrameScroll();
      // Streamlit may reset the attribute after analytics or request reruns.
      new MutationObserver(enableFrameScroll).observe(hostFrame,{attributes:true,attributeFilter:['scrolling']});
    }
  }catch(e){}
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:900},'*');
}
